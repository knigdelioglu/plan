org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Keep daemon reuse for consecutive Gradle invocations.
# Cache reproducible task outputs and reuse Gradle configuration where supported.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# The verified published AAR is the default for local, CI, UI and release builds.
# Plan uses the Maven repository in settings.gradle.kts when this property is present.
composePublishedVersion=0.1.2
