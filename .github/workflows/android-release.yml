name: Publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_composeDesignSystemSources: ../compose-design-system/design-system/src/main/java
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared Compose design system
        uses: actions/checkout@v4
        with:
          repository: knigdelioglu/compose-design-system
          ref: 4c6d96ab1f91c2dae1bbe30b5dfb8f2f946c7b51
          path: compose-design-system
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
      - name: Build debug-signed APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare verified release files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Plan-v1.0.2-debug.apk
          test -s dist/Plan-v1.0.2-debug.apk
          unzip -t dist/Plan-v1.0.2-debug.apk >/dev/null
          cd dist
          sha256sum Plan-v1.0.2-debug.apk > Plan-v1.0.2-debug.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 \
            dist/Plan-v1.0.2-debug.apk \
            dist/Plan-v1.0.2-debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Plan Android v1.0.2 (test APK)" \
            --notes "Haftalık kart ve özel günler sol panelde; açılış haftası takvime göre otomatik seçilir, takvim ilerlemesi otomatik hesaplanır, öğretmen notları sistem gezinti çubuğu üzerinde kaydırılabilir. Bu APK hata ayıklama anahtarıyla imzalanmıştır; üretim imzası değildir. Önceden farklı anahtarla imzalanmış sürümlerin üzerine kurulamayabilir."
