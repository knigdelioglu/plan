name: Publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'android/app/build.gradle.kts'

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Compose Design System
        uses: ./.github/actions/checkout-compose-design-system
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
      - name: Test and build debug-signed APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Resolve APK version and verify asset
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, subprocess

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          output = root / "android/app/build/outputs/apk/debug"
          metadata = json.loads((output / "output-metadata.json").read_text())
          assert metadata["applicationId"] == "com.plan.app", "Unexpected APK package"
          assert metadata["variantName"] == "debug", "Unexpected build variant"
          elements = metadata["elements"]
          assert len(elements) == 1, "Expected exactly one APK"
          version = elements[0]["versionName"]
          assert re.fullmatch(r"[0-9]+\\.[0-9]+\\.[0-9]+", version), "Unexpected APK version"
          name = f"Plan-v{version}-debug.apk"
          source = output / elements[0]["outputFile"]
          assert source.is_file() and source.stat().st_size > 0, "APK missing"
          subprocess.run(["unzip", "-t", str(source)], check=True, stdout=subprocess.DEVNULL)
          dist = root / "dist"
          dist.mkdir(exist_ok=True)
          shutil.copy2(source, dist / name)
          subprocess.run(["sha256sum", name], cwd=dist, check=True, stdout=(dist / (name + ".sha256")).open("w"))
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"RELEASE_VERSION={version}\\nRELEASE_APK={name}\\n")
          print(f"Verified {name} against Gradle APK output metadata")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Increment app version before publishing again."
            exit 1
          fi
          sha="$(cat .github/compose-design-system.ref)"
          gh release create "$tag" \\
            "dist/$RELEASE_APK" \\
            "dist/$RELEASE_APK.sha256" \\
            --target "$GITHUB_SHA" \\
            --title "Plan Android $tag (test APK)" \\
            --notes "Compose Design System commit: $sha. APK version is derived from the built app metadata and verified with SHA-256. This is debug-signed; a different signature may prevent in-place installation."
