name: Android CI
on:
  pull_request:
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37"
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
