name: Android CI
on:
  pull_request:
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_composeDesignSystemSources: ../compose-design-system/design-system/src/main/java
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared Compose design system
        uses: actions/checkout@v4
        with:
          repository: knigdelioglu/compose-design-system
          ref: 4c6d96ab1f91c2dae1bbe30b5dfb8f2f946c7b51
          path: compose-design-system
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
