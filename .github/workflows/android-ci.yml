name: Android CI
on:
  pull_request:
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
      - '.github/compose-design-system.ref'
      - '.github/actions/checkout-compose-design-system/**'
  workflow_dispatch:
    inputs:
      compose_legacy_sources:
        description: 'Emergency rollback to the previously pinned Compose source revision'
        required: false
        type: boolean
        default: false
      compose_published_version:
        description: 'Optional published Compose version to smoke-test instead of pinned sources'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
      - '.github/compose-design-system.ref'
      - '.github/actions/checkout-compose-design-system/**'
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Compose Design System
        if: ${{ inputs.compose_legacy_sources == true }}
        uses: ./.github/actions/checkout-compose-design-system
      - name: Enable explicitly requested legacy source rollback
        if: ${{ inputs.compose_legacy_sources == true }}
        run: echo "ORG_GRADLE_PROJECT_composeLegacySources=true" >> "$GITHUB_ENV"
      - name: Select published binary for explicit smoke run
        if: ${{ inputs.compose_published_version != '' && inputs.compose_legacy_sources != true }}
        env:
          VERSION: ${{ inputs.compose_published_version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "ORG_GRADLE_PROJECT_composePublishedVersion=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Verify release APK metadata and checksum
        run: python3 android/scripts/prepare-release.py
      - name: Smoke-test local pinned Compose source resolution
        if: ${{ inputs.compose_published_version == '' }}
        shell: bash
        working-directory: android
        run: |
          mkdir -p .compose-deps
          ln -s "$GITHUB_WORKSPACE/compose-design-system" .compose-deps/compose-design-system
          env -u ORG_GRADLE_PROJECT_composeDesignSystemSources ./gradlew :app:help --no-daemon --stacktrace
