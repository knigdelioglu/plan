name: Android CI
on:
  pull_request:
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
      - '.github/compose-design-system.ref'
      - '.github/actions/checkout-compose-design-system/**'
  workflow_dispatch:
    inputs:
      compose_published_version:
        description: 'Optional published Compose version to smoke-test instead of pinned sources'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ci.yml'
      - '.github/compose-design-system.ref'
      - '.github/actions/checkout-compose-design-system/**'
permissions:
  contents: read

concurrency:
  group: plan-android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Compose Design System
        if: ${{ inputs.compose_published_version == '' }}
        uses: ./.github/actions/checkout-compose-design-system
      - name: Select published binary for explicit smoke run
        if: ${{ inputs.compose_published_version != '' }}
        env:
          VERSION: ${{ inputs.compose_published_version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "ORG_GRADLE_PROJECT_composePublishedVersion=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform only if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            echo "Android SDK platform 36 is already available."
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          fi
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Verify release APK metadata and checksum
        run: python3 android/scripts/prepare-release.py
      - name: Smoke-test local pinned Compose source resolution
        if: ${{ inputs.compose_published_version == '' }}
        shell: bash
        working-directory: android
        run: |
          mkdir -p .compose-deps
          ln -s "$GITHUB_WORKSPACE/compose-design-system" .compose-deps/compose-design-system
          env -u ORG_GRADLE_PROJECT_composeDesignSystemSources ./gradlew :app:help --stacktrace
