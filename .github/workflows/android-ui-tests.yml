name: Android UI and Accessibility

on:
  pull_request:
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ui-tests.yml'
      - '.github/scripts/android-ui-display.sh'
      - '.github/compose-design-system.ref'
      - '.github/actions/checkout-compose-design-system/**'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'plans/**'
      - '.github/workflows/android-ui-tests.yml'
      - '.github/scripts/android-ui-display.sh'
      - '.github/compose-design-system.ref'
      - '.github/actions/checkout-compose-design-system/**'
  workflow_dispatch:
    inputs:
      compose_published_version:
        description: 'Optional published Compose version to smoke-test instead of pinned sources'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plan-android-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-ui-tests:
    name: Compose UI (${{ matrix.display }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        display: [compact, tablet-portrait, tablet-landscape]
    steps:
      - uses: actions/checkout@v4
      - name: Select published binary for explicit UI compatibility run
        if: ${{ inputs.compose_published_version != '' }}
        env:
          VERSION: ${{ inputs.compose_published_version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "ORG_GRADLE_PROJECT_composePublishedVersion=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # One clean AVD is shared by all three display sizes. The per-matrix
      # resize is applied only after boot, so the cached image stays pristine.
      - name: Restore clean Android emulator snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: plan-avd-${{ runner.os }}-api35-googleapis-x86_64-pixel5-v1
      - name: Prepare clean Android emulator snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "Cached a clean emulator snapshot."
      - name: Run native Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/android-ui-display.sh ${{ matrix.display }}
      - name: Print Android instrumentation test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          paths = list(pathlib.Path("android/app/build/outputs/androidTest-results").rglob("*.xml"))
          print(f"Instrumentation report XML files: {len(paths)}")
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
                  for case in root.iter("testcase"):
                      failures = list(case.findall("failure")) + list(case.findall("error"))
                      for fail in failures:
                          print("FAILED:", case.get("classname"), case.get("name"), str(fail.get("message") or ""))
                          print((fail.text or "")[:2000])
              except Exception as exc:
                  print("Could not parse", path, exc)
          PY
      - name: Upload UI test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ui-test-reports-${{ matrix.display }}
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
