name: Android UI and Accessibility

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ui-tests.yml'
      - '.github/scripts/android-ui-display.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-ui-tests:
    name: Compose UI (${{ matrix.display }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        display: [compact, tablet-portrait, tablet-landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-ui-display.sh ${{ matrix.display }}
      - name: Upload UI test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ui-test-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
